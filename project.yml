name: MinRejsetider
options:
  bundleIdPrefix: dk.minrejsetider
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  MinRejsetider:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/MinRejsetider.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dk.minrejsetider.MinRejsetider
      INFOPLIST_KEY_CFBundleDisplayName: MinRejsetider
      INFOPLIST_KEY_LSRequiresIPhoneOS: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
    dependencies:
      - target: RejsetiderWidgetExtension

  RejsetiderWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/WidgetInfo.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dk.minrejsetider.MinRejsetider.widget
      INFOPLIST_KEY_CFBundleDisplayName: RejsetiderWidget
      CODE_SIGN_STYLE: Automatic

schemes:
  MinRejsetider:
    build:
      targets:
        MinRejsetider: all
        RejsetiderWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
