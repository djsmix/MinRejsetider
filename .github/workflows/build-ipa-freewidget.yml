name: Build Live Activity IPA (no App Groups)

on:
  workflow_dispatch:
  push:
    paths:
      - "App/**"
      - "Shared/**"
      - "Widget/**"
      - "project.yml"
      - ".github/workflows/build-ipa-freewidget.yml"
      - ".github/workflows/strip_groups_only.py"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -p

      - name: Install xcodegen + pyyaml
        run: |
          brew install xcodegen || true
          python3 -m pip install --break-system-packages pyyaml || pip3 install --break-system-packages pyyaml || python3 -m pip install pyyaml

      - name: Strip App Groups only (keep ActivityKit extension)
        run: python3 .github/workflows/strip_groups_only.py

      - name: Generate project
        run: xcodegen generate

      - name: Validate IPA structure
        run: echo "(valideres efter build)"

      - name: Build .app (unsigned, app+Live Activity)
        run: |
          xcodebuild \
            -project MinRejsetider.xcodeproj \
            -scheme MinRejsetider \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Validate bundle
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          APPEX="$APP/PlugIns/RejsetiderWidgetExtension.appex"
          echo "=== arch ==="; lipo -info "$APP/MinRejsetider"; lipo -info "$APPEX/RejsetiderWidgetExtension"
          echo "=== appex files ==="; find "$APPEX" -type f -o -type l | head; find "$APPEX" -name "_CodeSignature" -maxdepth 2
          echo "=== app id ==="; plutil -extract CFBundleIdentifier raw "$APP/Info.plist"
          echo "=== appex id ==="; plutil -extract CFBundleIdentifier raw "$APPEX/Info.plist"
          echo "=== appex plist FULL ==="; plutil -p "$APPEX/Info.plist"
          echo "=== appex minOS ==="; plutil -extract MinimumOSVersion raw "$APPEX/Info.plist"; plutil -extract LSMinimumSystemVersion raw "$APPEX/Info.plist" || true
          echo "=== appex exec bit ==="; ls -l "$APPEX/RejsetiderWidgetExtension"
          echo "=== bundle ==="; find "$APP" -type f | head -20

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found $APP"
          rm -rf Payload MinRejsetider-freewidget-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r MinRejsetider-freewidget-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinRejsetider-freewidget-unsigned
          path: MinRejsetider-freewidget-unsigned.ipa

      - name: Publish GitHub Release (direkte .ipa, ingen zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freewidget-${{ github.run_number }}
          name: Live Activity TEST (build ${{ github.run_number }})
          body: |
            App + Live Activity UDEN App Groups — test til RustSign/eSign.
            Hent .ipa'en direkte herunder (ingen udpakning nødvendig).
            Start Live Activity fra appens forside. Ingen almindelig widget.
            Nye realtime-data overføres, mens appen er åben.
            Commit: ${{ github.sha }}
          files: MinRejsetider-freewidget-unsigned.ipa
          prerelease: true
