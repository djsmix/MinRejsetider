name: Update eSign repo JSON

on:
  # NB: 'release: published' duer ikke — releases oprettes med GITHUB_TOKEN,
  # og den slags events starter ikke nye runs. Derfor kører vi når builds er færdige.
  workflow_run:
    workflows:
      - "Build free-signing IPA (app+widget, no App Groups)"
      - "Build eSign IPA (app-only, no widget/groups)"
      - "Build unsigned IPA (no Mac needed)"
      - "Build ipapatch widget IPA"
    types: [completed]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate docs/apps.json + docs/esign.json
        run: python3 .github/workflows/update_source.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          git config user.name "minrejsetider-bot"
          git config user.email "bot@example.com"
          git add docs/apps.json docs/esign.json
          git diff --staged --quiet || (git commit -m "Opdater app-kilde til nyeste release" && git push)
