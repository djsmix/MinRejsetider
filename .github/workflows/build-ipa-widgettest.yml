name: Build widget TEST IPA (static, no App Intents)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -p

      - name: Install xcodegen + pyyaml
        run: |
          brew install xcodegen || true
          python3 -m pip install --break-system-packages pyyaml || pip3 install --break-system-packages pyyaml || python3 -m pip install pyyaml

      - name: Strip App Groups (keep widget)
        run: python3 .github/workflows/strip_groups_only.py

      - name: Strip App Intents (static test widget)
        run: python3 .github/workflows/strip_intent_for_test.py

      - name: Generate project
        run: xcodegen generate

      - name: Build .app (unsigned, static test widget)
        run: |
          xcodebuild \
            -project MinRejsetider.xcodeproj \
            -scheme MinRejsetider \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found $APP"
          rm -rf Payload MinRejsetider-widgettest-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r MinRejsetider-widgettest-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinRejsetider-widgettest-unsigned
          path: MinRejsetider-widgettest-unsigned.ipa

      - name: Publish GitHub Release (direkte .ipa, ingen zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widgettest-${{ github.run_number }}
          name: Widget TEST uden intents (build ${{ github.run_number }})
          body: |
            TEST-build: widget UDEN App Intents (statisk). Viser blot "Test".
            Bruges til at isolere eSign-installationsfejl. IKKE til daglig brug.
          files: MinRejsetider-widgettest-unsigned.ipa
          prerelease: true
